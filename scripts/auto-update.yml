# Optional: daily server-side news refresh.
# To enable, move this file to .github/workflows/auto-update.yml (GitHub web editor: Add file → Create new file,
# name it .github/workflows/auto-update.yml and paste this content). The site already refreshes news in the
# browser via assets/js/live.js; this adds a daily commit so data/news.json stays fresh for crawlers too.
name: Auto-update news

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh health news
        run: python3 scripts/update_news.py
      - name: Commit changes
        run: |
          git config user.name "lab-direct-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "Nothing to update"
          else
            git commit -m "Auto-update: health news"
            git push
          fi
